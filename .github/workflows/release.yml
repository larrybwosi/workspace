name: Release

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [closed]

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # Runs on every push to main or dev, EXCEPT when the run is a dev->main
  # merge — that code was already tested when it landed on dev, so we
  # skip straight to cutting the release.
  # ---------------------------------------------------------------------
  test:
    if: "!(github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'main' && github.head_ref == 'dev')"
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # =======================================================================
  # DEV: minor release, gated to only run when Android Kotlin code changed
  # =======================================================================
  detect-android-kotlin:
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'dev')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.kotlin }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # push event -> paths-filter diffs against github.event.before automatically
          filters: |
            kotlin:
              - 'apps/android/**/*.kt'
              - 'apps/android/**/*.kts'

  version-dev:
    needs: [test, detect-android-kotlin]
    if: (github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'dev')) && needs.detect-android-kotlin.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --no-frozen-lockfile --dangerously-allow-all-builds
      - name: Bump minor version
        id: bump
        run: |
          git fetch --tags || true
          npm version minor --no-git-tag-version
          node scripts/ensure-unique-version.js
          pnpm install --no-frozen-lockfile
          node scripts/update-version.js android
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bump minor version to ${{ steps.bump.outputs.version }} (android) [skip ci]" || echo "No changes to commit"
          git tag v${{ steps.bump.outputs.version }}
          git pull --rebase origin dev || true
          git push origin dev --tags

  create-release-dev:
    needs: [version-dev]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.version-dev.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-dev.outputs.version }}
          name: v${{ needs.version-dev.outputs.version }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-release-dev:
    needs: [version-dev, create-release-dev]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew
      - name: Build Release APK
        env:
          API_URL: http://localhost:3000
        run: cd apps/android && ./gradlew assembleRelease
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-dev.outputs.version }}
          files: apps/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =======================================================================
  # MAIN: every push/merge to main bumps the version and cuts a release.
  # No changesets — version is bumped directly (patch) and published.
  # =======================================================================
  version-main:
    needs: [test]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --no-frozen-lockfile --dangerously-allow-all-builds
      - name: Bump patch version
        id: bump
        run: |
          git fetch --tags || true
          npm version patch --no-git-tag-version
          node scripts/ensure-unique-version.js
          pnpm install --no-frozen-lockfile
          node scripts/update-version.js
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]" || echo "No changes to commit"
          git tag v${{ steps.bump.outputs.version }}
          git pull --rebase origin main || true
          git push origin main --tags
      - name: Publish to npm
        run: pnpm publish -r --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPS_TOKEN || secrets.NPM_TOKEN }}
        continue-on-error: true

  docker-publish:
    needs: [test, version-main]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        apps: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update Version
        run: node scripts/update-version.js
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Get version
        id: get_version
        run: |
          VERSION=${{ needs.version-main.outputs.version }}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Lowercase repo name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/$REPO_LOWER/${{ matrix.apps }}" >> $GITHUB_ENV
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.apps }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Scrymechat ${{ matrix.apps }} service
            org.opencontainers.image.version=${{ steps.get_version.outputs.VERSION }}
          cache-from: type=gha,scope=${{ matrix.apps }}
          cache-to: type=gha,mode=min,scope=${{ matrix.apps }}

  create-release-main:
    needs: [version-main]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.version-main.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-main.outputs.version }}
          name: v${{ needs.version-main.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  native-android-release:
    needs: [version-main, create-release-main]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew
      - name: Build Release APK
        env:
          API_URL: http://localhost:3000
        run: cd apps/android && ./gradlew assembleRelease
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-main.outputs.version }}
          files: apps/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-release:
    needs: [version-main, create-release-main]
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
          - host: windows-latest
          - host: macos-latest
    runs-on: ${{ matrix.settings.host }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies (ubuntu only)
        if: matrix.settings.host == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --no-frozen-lockfile --dangerously-allow-all-builds
      - name: Run Prisma Generate
        run: pnpm --filter @repo/database run db:generate
      - name: Build Shared Packages
        run: |
          pnpm --filter @repo/shared build || true
          pnpm --filter @repo/api-client build || true
      - name: Update Version
        run: node scripts/update-version.js
      - name: Build Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v${{ needs.version-main.outputs.version }}
          args: ${{ matrix.settings.host == 'windows-latest' && '--bundles msi' || '' }}
